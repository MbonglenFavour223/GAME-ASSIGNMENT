```html
<!DOCTYPE html>
<html>

<head>
    <title>Grams to Kilograms Converter</title>
</head>

<body>

    <h2>Grams to Kilograms Converter</h2>

    <label>Enter weight in grams:</label>

    <input type="number" id="grams">

    <button onclick="convert()">Convert</button>

    <h3 id="result"></h3>

    <script>
        function convert() {

            let grams = document.getElementById("grams").value;

            let kilograms = grams / 1000;

            document.getElementById("result").innerHTML =
                kilograms + " Kilograms";

        }
    </script>

</body>

</html>
```
